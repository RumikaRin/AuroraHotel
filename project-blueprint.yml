schemaVersion: 1
project:
  name: Aurora Hotel
  summary: A production-ready, mobile-first direct hotel booking platform for
    Aurora Hotel in Vietnam, combining a public bilingual website, real booking
    engine, customer accounts, hotel operations, day-level inventory and
    pricing, sandbox payments, transactional notifications, reporting, and
    foundations for future multi-hotel and OTA integrations.
  primaryOutcome: Increase completed direct room bookings through a fast,
    transparent, trustworthy mobile-first booking flow while keeping day-level
    price and availability accurate and preventing overbooking.
  profile: next-monolith
  archetypes:
    - booking
    - ecommerce
    - content-cms
    - dashboard-internal
