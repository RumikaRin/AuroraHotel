providers:
  - id: billing-vnpay
    capabilityId: billing
    provider: vnpay
    status: selected
    sourceRefs:
      - discovery:billing-provider
  - id: email-provider-neutral-emailprovider-boundary-local-and-automated-tests-capture-safe-previews-without-external-delivery-the-deployed-graduation-demo-uses-resend-within-the-provider-plan-available-without-paid-infrastructure-at-implementation-time-booking-and-identity-services-must-not-import-resend-directly
    capabilityId: email
    provider: Provider-neutral EmailProvider boundary. Local and automated tests
      capture safe previews without external delivery; the deployed graduation
      demo uses Resend within the provider plan available without paid
      infrastructure at implementation time. Booking and identity services must
      not import Resend directly.
    status: selected
    sourceRefs:
      - discovery:email-provider
  - id: file-upload-cloudinary-backed-mediastorage-adapter-for-the-graduation-demo-deployment-using-only-the-provider-plan-available-without-paid-infrastructure-at-implementation-time-domain-logic-must-depend-on-a-provider-neutral-mediastorage-interface-so-production-can-move-to-s3-compatible-storage-without-rewriting-hotel-or-booking-services
    capabilityId: file-upload
    provider: Cloudinary-backed MediaStorage adapter for the graduation-demo
      deployment, using only the provider plan available without paid
      infrastructure at implementation time. Domain logic must depend on a
      provider-neutral MediaStorage interface so production can move to
      S3-compatible storage without rewriting hotel or booking services.
    status: selected
    sourceRefs:
      - discovery:file-storage
security:
  baseline: owasp-asvs-l2
  dataClassification: confidential
  trustBoundaries: []
quality:
  locales:
    - vi
    - en
  gates:
    - lint
    - typecheck
    - test
    - build
    - e2e
  acceptanceCriteria:
    - A guest can search real day-level availability, select rooms and rate
      plans, add services, complete a mock or sandbox payment, and receive a
      clear booking confirmation
    - Concurrent requests cannot confirm more rooms than inventory permits
    - All booking, inventory, coupon, payment, refund, and status transitions
      are atomic and idempotent where required
    - Guest, Customer, Receptionist, Housekeeping, Manager, and Admin
      permissions are enforced server-side with audit logs
    - Prices, taxes, fees, deposits, and cancellation terms remain transparent
      throughout the booking journey
    - Vietnamese and English public experiences meet WCAG 2.2 AA and good Core
      Web Vitals targets
    - The system includes normalized PostgreSQL migrations, repeatable realistic
      demo seed data, ERD and required architecture diagrams
    - Unit, integration, concurrency, security, and Playwright E2E gates pass in
      the documented order
    - The graduation demo uses provider plans available without paid
      infrastructure wherever feasible, monitors their quotas, and introduces no
      paid service without explicit owner approval
    - The demo never stores real secrets or raw card data
deployment:
  target: Vercel for the graduation-demo application with a managed PostgreSQL
    provider plan available without paid infrastructure at implementation time.
    External services remain behind adapters and the project runs locally
    without Docker. Production use requires a reviewed upgrade plan, custom
    domain, capacity checks, backups, and paid-service decisions where no-cost
    quotas are insufficient.
  topology: next-monolith
