schemaVersion: 1
project:
  name: Aurora Hotel
  type: next-monolith
  primaryGoal: Increase completed direct room bookings through a fast,
    transparent, trustworthy mobile-first booking flow while keeping day-level
    price and availability accurate and preventing overbooking.
blueprint:
  path: project-blueprint.yml
  sha256: 0633e518ad2ac7ec14118204ae98c3dea1cdd23226c817fde1bd19253710302d
experience:
  path: experience-blueprint.yml
  sha256: 91505645c810b460b8bc702de49a6af4b2071347d636eb1eb25b1d027ee70a40
profile: next-monolith
stack:
  language: typescript
  runtime: node
  framework: next
  frameworkVersion: 15.5.22
  packageManager: npm
capabilities:
  - accessibility
  - authentication
  - background-jobs
  - backup-restore
  - billing
  - commerce
  - database
  - email
  - file-upload
  - i18n
  - observability
  - privacy
  - rbac
  - seo
  - session-registry
  - web-experience
  - webhooks
locales:
  - vi
  - en
hosting:
  target: Vercel Hobby for the graduation-demo application with Neon Free PostgreSQL and Vercel Blob (aurora-media-private for quarantine and aurora-media-public for validated delivery). External services remain behind adapters and the project runs without mandatory local PostgreSQL or Docker dependencies. Paid upgrades require explicit owner approval.
data:
  classification: confidential
  database: postgresql
security:
  baseline: owasp-asvs-l2
execution:
  filesystem: workspace-write
  workspaceRoots:
    - .
  network: denied-unless-declared
  externalWrites: deny
  destructiveActions: approval-required
  secrets: explicit-allowlist
context:
  instructionBudget: host-aware
  retrieval: disabled
state:
  format: agent-os-v1
  trajectory: redacted
  retention: project-policy
billing:
  provider: vnpay
quality:
  gates:
    - lint
    - typecheck
    - test
    - build
    - e2e
diagrams:
  required:
    - auth-flow
    - authz-flow
    - containers
    - data-lifecycle
    - deployment
    - erd
    - migration-flow
    - modules
    - release-flow
    - request-flow
    - role-permission-map
    - session-lifecycle
    - system-context
    - verification-idempotency-sequence
