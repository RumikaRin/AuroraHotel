name: CI

on:
  push:
  pull_request:

concurrency:
  group: aurora-neon-test
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    env:
      NODE_ENV: test
      DATABASE_ENVIRONMENT: test
      DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.NEON_TEST_DIRECT_URL }}
      TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
      TEST_DIRECT_URL: ${{ secrets.NEON_TEST_DIRECT_URL }}
      ALLOW_REMOTE_TEST_RESET: aurora_test
      AUTH_SECRET: "ci-only-secret-not-for-production-0123456789"
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify CI Environment Isolation
        run: node --experimental-strip-types scripts/verify-ci-environment.mjs
        if: ${{ env.DATABASE_URL != '' }}
      - name: Run Database Test Reset
        run: npm run db:test:reset
        if: ${{ env.DATABASE_URL != '' }}
      - name: Lint, typecheck, unit tests, build
        run: npm run check

  e2e:
    runs-on: ubuntu-latest
    needs: check
    if: ${{ secrets.NEON_TEST_DATABASE_URL != '' }}
    env:
      NODE_ENV: test
      DATABASE_ENVIRONMENT: test
      DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.NEON_TEST_DIRECT_URL }}
      TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
      TEST_DIRECT_URL: ${{ secrets.NEON_TEST_DIRECT_URL }}
      ALLOW_REMOTE_TEST_RESET: aurora_test
      AUTH_SECRET: "ci-only-secret-not-for-production-0123456789"
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
